# Nginx site for the Droplet. The CI/CD pipeline copies this file to
# /etc/nginx/sites-enabled/myapp and reloads Nginx on every deploy.
#
#   /            -> Angular app (static files in /var/www/fitness-web)
#   /api/, /swagger, /health -> ASP.NET Core API on 127.0.0.1:5000

server {
    listen 80;
    server_name _;

    root /var/www/fitness-web;
    index index.html;

    # gzip text files
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /swagger {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5000;
    }

    # Angular files have a hash in their name -> safe to cache for a long time
    location ~* \.(js|css|woff2|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other URL (/plans/3, /admin/users, ...) is an Angular route
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
