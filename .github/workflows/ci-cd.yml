name: CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build WebApplicationAPI.slnx -c Release

      - name: Publish
        run: dotnet publish WebApplicationAPI/WebApplicationAPI.csproj -c Release -r linux-x64 --self-contained true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: publish

  deploy:
    name: Deploy to Droplet
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: publish

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy files to server
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" publish/ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/fitnessapi/"

      - name: Restart API
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" '
            set -e
            chmod +x /var/www/fitnessapi/WebApplicationAPI
            systemctl restart fitnessapi
            curl -fsS --retry 10 --retry-delay 3 --retry-connrefused -o /dev/null http://localhost:5000/swagger/index.html
            echo "Deploy OK"
          '