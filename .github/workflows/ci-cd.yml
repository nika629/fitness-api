name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore WebApplicationAPI.slnx

      - name: Build
        run: dotnet build WebApplicationAPI.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test WebApplicationAPI.slnx -c Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish WebApplicationAPI/WebApplicationAPI.csproj -c Release -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: publish
          retention-days: 7

  deploy:
    name: Deploy to Droplet
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: api
          path: publish

      - name: Set up